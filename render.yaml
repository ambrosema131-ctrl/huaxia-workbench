# Render.com 部署配置
# 免费 Web Service - 数据在运行期间可读写，重启后恢复初始数据
# 如需持久化数据，升级到付费版并取消下方 disk 配置的注释

services:
  - type: web
    name: huaxia-workbench
    env: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
    # 如需数据持久化，升级到 Starter 计划后取消注释：
    # disk:
    #   name: data
    #   mountPath: /opt/data
    #   sizeGB: 1
